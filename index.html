<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="HW7 — homework document">
  <title>HW7</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1.25rem;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
    }

    h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .actions { display: flex; gap: 0.6rem; }

    .actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.4rem;
      padding: 0.45rem 0.85rem;
      border: 1px solid #d1d5db;
      border-radius: 0.55rem;
      color: #111827;
      background: #fff;
      font-size: 0.9rem;
      font-weight: 550;
      text-decoration: none;
    }

    .actions a:hover { background: #f9fafb; }

    main {
      flex: 1;
      min-height: 0;
      padding: 0.85rem;
    }

    .viewer {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 65vh;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      background: #e5e7eb;
    }

    .fallback {
      max-width: 38rem;
      margin: 2rem auto;
      padding: 1.5rem;
      border-radius: 0.75rem;
      background: #fff;
      line-height: 1.55;
      text-align: center;
    }

    .fallback a { color: #1d4ed8; }

    @media (max-width: 520px) {
      header { padding: 0.75rem; }
      h1 { font-size: 1rem; }
      .actions a { padding: 0.4rem 0.6rem; font-size: 0.82rem; }
      main { padding: 0.4rem; }
      .viewer { min-height: 70vh; border-radius: 0.25rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>HW7</h1>
    <nav class="actions" aria-label="PDF actions">
      <a href="./HW7.pdf" target="_blank" rel="noopener">Open PDF</a>
      <a href="./HW7.pdf" download>Download</a>
    </nav>
  </header>

  <main>
    <iframe
      class="viewer"
      src="./HW7.pdf#view=FitH"
      title="HW7 PDF document"
    >
      <div class="fallback">
        <p>Your browser cannot display embedded PDF files.</p>
        <p><a href="./HW7.pdf">Open or download HW7.pdf</a>.</p>
      </div>
    </iframe>
  </main>
</body>
</html>
